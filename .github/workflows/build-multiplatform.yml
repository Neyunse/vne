name: Build Multiplatform Engine

on:
  push:
    branches: [gh/neyunse/test]
  pull_request:
    branches: [gh/neyunse/test]


jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Generar env.py con VNE_KEY
        run: |
          echo "import os" > env.py
          echo "os.environ['VNE_KEY'] = '${{ secrets.VNE_KEY }}'" >> ./vne/env.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build engine and bootstrapper
        run: |
          python build.py
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/win*.zip

  build-linux:
    runs-on: ubuntu-22.04
    needs: build-windows
    steps:
      - name: Generar env.py con VNE_KEY
        run: |
          echo "import os" > env.py
          echo "os.environ['VNE_KEY'] = '${{ secrets.VNE_KEY }}'" >> env.py
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build engine and bootstrapper
        run: |
          python build.py
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/linux*.zip

  build-mac:
    runs-on: macos-14
    needs: build-linux
    steps:
      - name: Generar env.py con VNE_KEY
        run: |
          echo "import os" > env.py
          echo "os.environ['VNE_KEY'] = '${{ secrets.VNE_KEY }}'" >> env.py
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build engine and bootstrapper
        run: |
          python build.py
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist/mac*.zip
