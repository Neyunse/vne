name: Build Multiplatform Engine

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: write
  id-token: write
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Generate env.py with VNE_KEY
        run: |
          echo "import os" > env.py
          echo "os.environ['VNE_KEY'] = '${{ secrets.VNE_KEY }}'" >> ./vne/env.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build engine and bootstrapper
        run: |
          python build.py
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/vne-win.zip

  build-linux:
    runs-on: ubuntu-22.04
    needs: build-windows
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Generate env.py with VNE_KEY
        run: |
          echo "import os" > env.py
          echo "os.environ['VNE_KEY'] = '${{ secrets.VNE_KEY }}'" >> ./vne/env.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build engine and bootstrapper
        run: |
          python build.py
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/vne-linux.zip

  build-mac:
    runs-on: macos-14
    needs: build-linux
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Generate env.py with VNE_KEY
        run: |
          echo "import os" > env.py
          echo "os.environ['VNE_KEY'] = '${{ secrets.VNE_KEY }}'" >> ./vne/env.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build engine and bootstrapper
        run: |
          python build.py
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac
          path: dist/vne-darwin.zip

  create-release:
    runs-on: ubuntu-22.04
    needs: [build-windows, build-linux, build-mac]
    steps:
      - uses: actions/checkout@v3
      - name: Extract engine version
        id: get_version
        run: |
          VERSION=$(python -c "import re; f=open('vne/_version.py').read(); print(re.search(r'__version__\s*=\s*[\'\"]([^\'\"]+)[\'\"]', f).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Crear Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          body: "Automatic release generated by CI."
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Adjuntar artefactos
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Upload artifacts to the release
        run: |
          for file in ./artifacts/*/*; do
            gh release upload "${{ steps.get_version.outputs.version }}" "$file" --repo "$GITHUB_REPOSITORY"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
